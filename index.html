<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore a safe, interactive simulation of Rillion's accounts payable workflow.">
  <title>Rillion interactive demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="wordmark" href="#dashboard" aria-label="Rillion demo home"><img src="assets/rillion-logo-lime.svg" alt="Rillion" width="962" height="340"></a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-action="tour"><span class="icon"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9a2.4 2.4 0 1 1 3.6 2.1c-.9.5-1.4 1.1-1.4 2.2M12 17h.01"></path></svg></span><span>Guided tour</span></button>
        <button class="nav-item" data-action="reset"><span class="icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.3 6M4 11V5m0 6h6"></path></svg></span><span>Reset demo</span></button>
        <div class="profile"><span class="avatar">AN</span><span><strong>Alex Nguyen</strong><small>AP Manager</small></span></div>
      </div>
    </aside>

    <div class="app-body">
      <header class="topbar">
        <div>
          <div class="company-row"><p class="company">Northstar Manufacturing</p><span class="simulation-label">Interactive simulation · synthetic data</span></div>
          <h1 id="page-title">Good morning, Alex</h1>
        </div>
        <label class="search">
          <span class="sr-only">Search invoices, vendors, purchase orders, or reports</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
          <input id="search" type="search" placeholder="Search invoices, vendors, PO numbers…" autocomplete="off">
        </label>
        <div class="topbar-actions">
          <label class="role-switcher" for="role-select">
            <span>Approval role</span>
            <select id="role-select">
              <option value="all">All roles · 5</option>
              <option value="ap-review">AP review · 1</option>
              <option value="department-manager">Department manager · 3</option>
              <option value="finance-controller">Finance controller · 1</option>
            </select>
          </label>
          <button class="quiet-button" data-action="tour">Explore the workflow</button>
        </div>
      </header>

      <main id="workspace" tabindex="-1"></main>
    </div>
  </div>

  <section id="tour" class="tour" hidden aria-live="polite">
    <div>
      <span id="tour-count"></span>
      <h2 id="tour-title"></h2>
      <p id="tour-copy"></p>
    </div>
    <div class="tour-actions">
      <button class="text-button" data-action="tour-close">Close</button>
      <button class="primary-button" data-action="tour-next">Next</button>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
